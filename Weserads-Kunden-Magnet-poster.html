<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/assets/weserads-favicon.svg">
  <title>Bewertungs-Poster</title>
  <style>
    @font-face { font-family:'Manrope'; font-weight:400 800; font-display:swap; src:url('/assets/fonts/manrope-latin.woff2') format('woff2'); }
    @page { size:A4; margin:0; }
    * { box-sizing:border-box; }
    html, body { margin:0; background:#E5E9EE; font-family:'Manrope',-apple-system,Arial,sans-serif; color:#0A1931; }
    .bar { position:sticky; top:0; display:flex; gap:10px; justify-content:center; align-items:center; padding:12px; background:#13283F; color:#fff; font-weight:700; font-size:14px; flex-wrap:wrap; }
    .bar button { border:0; border-radius:999px; padding:10px 18px; background:#0EA5A0; color:#fff; font:inherit; font-weight:800; cursor:pointer; }
    .bar input { padding:9px 12px; border-radius:10px; border:0; font:inherit; min-width:240px; }
    .page { width:210mm; height:297mm; margin:16px auto; background:#fff; display:flex; flex-direction:column; align-items:center; text-align:center; padding:22mm 18mm 14mm; box-shadow:0 10px 40px #0002; position:relative; overflow:hidden; }
    .page::before { content:""; position:absolute; inset:0 0 auto 0; height:9mm; background:linear-gradient(90deg,#13283F,#0EA5A0); }
    .firma { font-size:15pt; font-weight:800; color:#0E887F; letter-spacing:.02em; margin-top:4mm; min-height:1em; }
    h1 { font-size:40pt; line-height:1.05; margin:6mm 0 4mm; letter-spacing:-.02em; }
    .stars { font-size:34pt; color:#F5B301; letter-spacing:4px; margin-bottom:6mm; }
    .qr { width:112mm; height:112mm; padding:5mm; border:2.5mm solid #0EA5A0; border-radius:8mm; display:flex; align-items:center; justify-content:center; }
    .qr img { width:100%; height:100%; image-rendering:pixelated; }
    .steps { display:flex; gap:7mm; margin-top:10mm; font-size:13pt; font-weight:700; }
    .steps div { display:flex; align-items:center; gap:3mm; }
    .steps b { width:9mm; height:9mm; border-radius:50%; background:#13283F; color:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:12pt; }
    .thanks { margin-top:9mm; font-size:15pt; color:#3C5265; }
    .foot { margin-top:auto; font-size:8.5pt; color:#94A3B8; }
    @media print { html, body { background:#fff; } .bar { display:none; } .page { margin:0; box-shadow:none; } }
    @media (max-width:820px) { .page { transform:scale(.45); transform-origin:top center; margin-bottom:-160mm; } }
  </style>
</head>
<body>
  <div class="bar">
    <span>Firmenname auf dem Poster:</span><input id="name" aria-label="Firmenname">
    <button onclick="window.print()">Drucken / als PDF speichern</button>
  </div>
  <div class="page">
    <div class="firma" id="firma"></div>
    <h1>Wie war’s bei uns?<br>Bewerten Sie uns<br>auf Google!</h1>
    <div class="stars">★★★★★</div>
    <div class="qr"><img id="qr" alt="QR-Code zur Google-Bewertung"></div>
    <div class="steps">
      <div><b>1</b> Kamera öffnen</div>
      <div><b>2</b> Code scannen</div>
      <div><b>3</b> Sterne vergeben</div>
    </div>
    <div class="thanks">Vielen Dank – Ihre Bewertung hilft uns sehr!</div>
    <div class="foot">Kunden-Magnet · weserads.de</div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const slug = (params.get('slug') || '').toLowerCase();
    const firma = params.get('firma') || '';
    const name = document.getElementById('name'), out = document.getElementById('firma');
    name.value = firma; out.textContent = firma;
    name.addEventListener('input', () => { out.textContent = name.value; });
    if (/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug)) {
      document.getElementById('qr').src = `/api/magnet/qr?slug=${encodeURIComponent(slug)}&format=png&size=1400`;
      document.title = `Bewertungs-Poster · ${firma || slug}`;
    } else {
      out.textContent = 'Kein gültiger Kunde angegeben.';
    }
  </script>
</body>
</html>
